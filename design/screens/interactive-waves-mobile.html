<style>
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes drawIn {
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes waveSlow1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-15%); }
      100% { transform: translateX(0); }
    }
    @keyframes waveSlow2 {
      0% { transform: translateX(-15%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(-15%); }
    }
    
    @keyframes waveFast1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-25%); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFast2 {
      0% { transform: translateX(-25%); }
      50% { transform: translateX(0); }
      100% { transform: translateX(-25%); }
    }

    .wave-bg-1 {
      animation: waveSlow1 15s ease-in-out infinite;
    }
    .wave-bg-2 {
      animation: waveSlow2 12s ease-in-out infinite;
    }

    body.waves-active .wave-wrapper {
      transform: scaleY(1.15);
    }
    body.waves-active .wave-bg-1 {
      animation: waveFast1 8s ease-in-out infinite;
    }
    body.waves-active .wave-bg-2 {
      animation: waveFast2 6s ease-in-out infinite;
    }
  </style>
<div class="wave-wrapper absolute bottom-0 left-0 w-full h-[40%] z-0 pointer-events-none opacity-80" style="transition: transform 0.5s ease-in-out; transform-origin: bottom;">

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const interactibles = document.querySelectorAll('.hover-trigger');
    interactibles.forEach(el => {
      el.addEventListener('mouseenter', () => {
        document.body.classList.add('waves-active');
      });
      el.addEventListener('mouseleave', () => {
        document.body.classList.remove('waves-active');
      });
    });
  });
</script>
